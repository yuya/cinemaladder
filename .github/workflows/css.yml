name: CSS を HTML に埋め込む

# css/ のファイルを直して push すると、index.html・about.html・privacy.html の <style> の中身を作り直してコミットする。
# GitHub の画面で css/ を直接編集しても、これが動くので HTML はそろう（手元で node scripts/build-css.mjs を実行してもよい）。
on:
  push:
    branches: [staging, main]
    paths:
      - "css/**"
      - "scripts/build-css.mjs"
      - "index.html"
      - "about.html"
      - "privacy.html"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: css-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: CSS を埋め込む
        run: node scripts/build-css.mjs
      - name: 変わっていればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html privacy.html
          if git diff --cached --quiet; then echo "埋め込みは最新です"; exit 0; fi
          git commit -m "css/ の変更を HTML に埋め込む"
          git pull --rebase -q origin "${GITHUB_REF_NAME}"
          git push
