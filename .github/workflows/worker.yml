name: 中継サーバー（Cloudflare Workers）を公開

on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:   # Actions 画面から手動でも実行できる

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Cloudflare の API トークンとアカウントIDは、リポジトリの Secret に入れておく
      - name: Cloudflare に公開
        working-directory: worker
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # 翻訳に使う DeepL のキーを、Worker の Secret として渡す（GitHub に登録してあるときだけ）
      - name: DeepL のキーを Worker に設定
        working-directory: worker
        run: |
          if [ -z "$DEEPL_API_KEY" ]; then echo "DEEPL_API_KEY が未登録なので飛ばします"; exit 0; fi
          printf '%s' "$DEEPL_API_KEY" | npx --yes wrangler@4 secret put DEEPL_API_KEY
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
